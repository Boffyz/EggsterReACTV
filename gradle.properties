org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# The old code references appcompat resources (e.g. R.attr.selectableItemBackground) through our own R class
android.nonTransitiveRClass=false
# AGP 8.7 was tested up to compileSdk 35; Landroid (Android 17) needs the API 36 SDK for its live notification
android.suppressUnsupportedCompileSdk=36
